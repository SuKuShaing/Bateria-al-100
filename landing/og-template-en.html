<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f1f5f9;
            width: 1200px;
            height: 630px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }
        .icon {
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 40px rgba(14, 165, 233, 0.4));
        }
        .title {
            font-size: 80px;
            font-weight: 800;
            margin: 0 0 20px 0;
            letter-spacing: -2px;
        }
        .highlight {
            color: #0ea5e9;
        }
        .subtitle {
            font-size: 32px;
            font-weight: 400;
            color: #94a3b8;
            margin: 0;
            text-align: center;
            max-width: 900px;
        }
        .glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(14,165,233,0.15) 0%, rgba(15,23,42,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <img src="icon.png" alt="Icon" class="icon">
        <h1 class="title">Battery <span class="highlight">at 100</span></h1>
        <p class="subtitle">Maximize Your Battery Life</p>
    </div>
</body>
</html>
